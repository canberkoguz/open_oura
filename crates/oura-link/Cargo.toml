[package]
name = "oura-link"
description = "BLE transport, connection, auth handshake and sync drain for Oura rings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oura-protocol = { path = "../oura-protocol" }
thiserror = "1"
hex = "0.4"
uuid = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1"
futures = { version = "0.3", optional = true }
btleplug = { version = "0.11", optional = true }

[features]
default = ["ble"]
# The btleplug BLE transport. Off for the iOS FFI build, where CoreBluetooth
# is driven from Swift and linking a second BLE central we never use would
# only invite entitlement questions.
ble = ["dep:btleplug", "dep:futures"]
